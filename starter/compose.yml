services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter-local-only
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - starter_pgdata:/var/lib/postgresql/data

volumes:
  starter_pgdata:
